# Configuracion usada solo por los tests (surefire pasa -Dedext.config con la ruta de este archivo).
# Base H2 en memoria: cada corrida de tests arranca con una base vacia y nunca toca la base real.
db.url=jdbc:h2:mem:edext_test;DB_CLOSE_DELAY=-1;MODE=MariaDB
db.driver=org.h2.Driver
db.usuario=sa
db.password=
db.esquema=create

# Imagenes de los tests dentro de target/, fuera de ~/.edEXT
imagen.ruta=target/test-imagenes

# Web Services en un puerto libre que asigna el sistema (no choca con un servidor real en el 9128)
ws.url=http://localhost:0/edext/publicador
